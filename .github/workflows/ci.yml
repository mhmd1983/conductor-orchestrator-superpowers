name: CI

on:
  push:
    branches: ["**"]
    paths:
      - "vscode-extension/**"
  pull_request:
    paths:
      - "vscode-extension/**"

jobs:
  build:
    name: Build & package extension
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: vscode-extension/package-lock.json

      - name: Install dependencies
        working-directory: vscode-extension
        run: npm ci

      - name: Compile TypeScript
        working-directory: vscode-extension
        run: npm run compile

      - name: Package VSIX
        working-directory: vscode-extension
        run: npm run package

      - name: Verify VSIX is a valid ZIP
        working-directory: vscode-extension
        run: |
          VSIX=$(ls *.vsix | head -1)
          echo "Packaged: $VSIX ($(du -h "$VSIX" | cut -f1))"
          # The VSIX must start with the ZIP magic bytes PK\x03\x04
          python3 -c "
          import sys
          data = open('$VSIX','rb').read(4)
          if data != b'PK\x03\x04':
              print('ERROR: not a valid ZIP file, magic bytes:', data.hex())
              sys.exit(1)
          print('OK: valid ZIP magic bytes')
          "

      - name: Upload VSIX artifact
        uses: actions/upload-artifact@v4
        with:
          name: conductor-orchestrator-superpowers-vsix
          path: vscode-extension/*.vsix
          retention-days: 30
